[package]
edition = "2024"
rust-version = "1.89"
name = "rav1d-safe"
version = "0.5.7"
authors = [
    "Rav1d Developers",
    "Prossimo",
    "Imazen",
]
build = "build.rs"
include = [
    "/src/**/*.rs",
    "/include/**/*.rs",
    "/lib.rs",
    "/build.rs",
    "/benches/**",
    "/examples/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Safe SIMD fork of rav1d - Rust AV1 decoder with archmage intrinsics"
readme = "README.md"
keywords = [
    "av1",
    "video",
    "decoder",
    "simd",
    "codec",
]
categories = [
    "multimedia::video",
    "multimedia::encoding",
]
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
repository = "https://github.com/imazen/rav1d-safe"

[features]
asm = ["c-ffi"]
asm_arm64_dotprod = ["asm"]
asm_arm64_i8mm = ["asm"]
asm_arm64_sve2 = ["asm"]
bitdepth_16 = []
bitdepth_8 = []
c-ffi = [
    "unchecked",
    "dav1d-compat",
    "libc",
]
dav1d-compat = []
default = [
    "bitdepth_8",
    "bitdepth_16",
]
partial_asm = ["unchecked"]
simd_test = []
unchecked = []

[lib]
name = "rav1d_safe"
crate-type = ["rlib"]
path = "lib.rs"

[[example]]
name = "decode_md5"
path = "examples/decode_md5.rs"

[[example]]
name = "demo_simple"
path = "examples/demo_simple.rs"

[[example]]
name = "dump_pixels"
path = "examples/dump_pixels.rs"

[[example]]
name = "managed_decode"
path = "examples/managed_decode.rs"

[[example]]
name = "perframe_md5"
path = "examples/perframe_md5.rs"

[[example]]
name = "profile_avif"
path = "examples/profile_avif.rs"

[[example]]
name = "profile_decode"
path = "examples/profile_decode.rs"

[[example]]
name = "profile_ivf"
path = "examples/profile_ivf.rs"

[[bench]]
name = "checked_vs_unchecked"
path = "benches/checked_vs_unchecked.rs"
harness = false

[[bench]]
name = "decode"
path = "benches/decode.rs"
harness = false

[[bench]]
name = "decode_avif"
path = "benches/decode_avif.rs"
harness = false

[[bench]]
name = "tango_decode"
path = "benches/tango_decode.rs"
harness = false

[[bench]]
name = "threading_bench"
path = "benches/threading_bench.rs"
harness = false

[[bench]]
name = "tile_threading"
path = "benches/tile_threading.rs"
harness = false

[dependencies.aligned]
version = "0.4"

[dependencies.archmage]
version = "0.9.15"
features = [
    "macros",
    "avx512",
]

[dependencies.assert_matches]
version = "1.5.0"

[dependencies.atomig]
version = "0.4.1"
features = ["derive"]

[dependencies.bitflags]
version = "2.4.0"

[dependencies.cfg-if]
version = "1.0.0"

[dependencies.libc]
version = "0.2"
optional = true

[dependencies.parking_lot]
version = "0.12.2"

[dependencies.paste]
version = "1.0.14"

[dependencies.rav1d-disjoint-mut]
version = "0.3.1"
features = [
    "std",
    "aligned",
    "pic-buf",
    "zerocopy",
]
default-features = false

[dependencies.raw-cpuid]
version = "11.0.1"

[dependencies.safe_unaligned_simd]
version = "0.2.5"
features = ["avx512"]

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.to_method]
version = "1.1.0"

[dependencies.zerocopy]
version = "0.8"
features = ["derive"]

[dev-dependencies.archmage]
version = "0.9.15"
features = [
    "macros",
    "avx512",
    "testable_dispatch",
]

[dev-dependencies.divan]
version = "0.1"

[dev-dependencies.md5]
version = "0.8.0"

[dev-dependencies.zenavif-parse]
version = "0.5.1"
features = ["eager"]

[dev-dependencies.zenbench]
version = "0.1.2"

[build-dependencies.cc]
version = "1.0.79"

[build-dependencies.nasm-rs]
version = "0.3"
features = ["parallel"]

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies.tango-bench]
version = "0.7"

[profile.bench]
lto = "fat"
codegen-units = 1

[profile.checked-release]
opt-level = 2
codegen-units = 16
inherits = "dev"

[profile.dev]
panic = "abort"

[profile.opt-dev]
opt-level = 1
inherits = "dev"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
strip = false

[profile.release-with-debug]
debug = "line-tables-only"
inherits = "release"
