[package]
name = "image-converter-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "image_converter"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp", "avif", "exr", "hdr", "tga"] }
tiff = "0.11"
psd = "0.3.5"
rawloader = "0.37.2"
heic-rs = { version = "0.1.1", default-features = false }
still265 = "0.6.0"
dicom-object = "0.10"
dicom-pixeldata = { version = "0.10", default-features = false, features = ["image", "native"] }
hayro = { version = "0.7.1", features = ["embed-fonts"] }
zenavif = { version = "0.1.6", default-features = false }
rgb = "0.8"
resvg = { version = "0.45.1", default-features = false, features = ["text", "raster-images"] }
jxl-oxide = { version = "0.12.6", default-features = false }
zune-jpegxl = { version = "0.5.2", default-features = false, features = ["std"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }

[patch.crates-io]
still265 = { path = "vendor/still265" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
